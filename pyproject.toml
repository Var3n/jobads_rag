[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hisrag"
version = "0.1.0"
description = "RAG over historical job advertisements (proof of concept)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "tqdm>=4.66",
    "requests>=2.31",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipywidgets>=8", "pillow>=10", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
include = ["hisrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
