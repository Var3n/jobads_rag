# Shared defaults. Machine-specific overrides (e.g. paths on the cluster) go into
# config.local.yaml next to this file (gitignored), or point HISRAG_CONFIG_LOCAL at one.

paths:
  data_dir: data                       # relative paths resolve against the repo root
  raw_csv: data/raw/wrz_extractions.csv
  ads_dir: data/ads                      # Parquet, partitioned newspaper=…/year=…
  derived_dir: data/derived              # one partitioned table per pipeline step, keyed by ad_id
  embeddings_dir: data/embeddings        # vectors per text variant and model (outside derived: no DuckDB view)
  eval_dir: data/eval                    # test questions and retrieval results (step 8)
  index_dir: data/index                  # LanceDB search index (step 9)
  cache_db: data/cache/llm_cache.sqlite
  usage_log: data/logs/usage.jsonl
  agent_log: data/logs/agent.jsonl      # every agent question with answer and tool trace (step 11)

api:
  base_url: https://api.dhinfra.uni-graz.at/v1
  api_key_env: DHINFRA_API_KEY
  timeout_s: 600                        # per request; long answers with reasoning can take minutes
  connect_timeout_s: 15                 # fail fast when the API is unreachable
  max_retries: 8                        # openai client retries 429/5xx and honours Retry-After
  max_workers: 16                       # thread pool size for parallel jobs
  requests_per_minute: 120              # client-side limiter, keep at or below the key's limit

llm:
  model: qwen3.5-397b
  context_tokens: 256000
  structured_output: json_schema        # json_schema | prompt | auto  (00_api_check: json_schema works)

# Search index (step 9): the step-8 winner, cut to its first `dims` dimensions and renormalized.
index:
  model: qwen3-embedding-8b
  variant: enriched                     # ad + "Stelle/Anforderungen/Lohn" (hisrag.eval.retrieval.documents)
  dims: 1024
  ann_min_rows: 1000000                 # below this the vector search is exact (flat); above, an ANN index is built
  ann_index_type: IvfHnswSq             # a class of lancedb.index

# Agent loop (step 11)
agent:
  thinking: true                        # Qwen reasoning: pilot 1 was no slower with it and failed less
  max_steps: 12                         # model requests with tools; then one last request for the answer
  max_tokens: 8000                      # per request (reasoning counts against it)
  timeout_s: 900

# Query/passage prefixes follow each model's card. They are what step 8 compares.
embeddings:
  default: bge-m3
  batch_size: 64
  models:
    bge-m3:
      query_prefix: ""
      passage_prefix: ""
    qwen3-embedding-8b:
      query_prefix: "Instruct: Given a search query about historical job advertisements, retrieve relevant advertisements\nQuery: "
      passage_prefix: ""
    jina-embeddings-v3:
      query_model: jina-embeddings-v3-query
      passage_model: jina-embeddings-v3-passage
      query_prefix: ""
      passage_prefix: ""
    jina-embeddings-v4-text-retrieval:
      query_prefix: "Query: "
      passage_prefix: "Passage: "
    embeddinggemma-300m:
      query_prefix: "task: search result | query: "
      passage_prefix: "title: none | text: "
